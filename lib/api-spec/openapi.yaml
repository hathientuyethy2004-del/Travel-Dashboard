openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Smart Travel Platform Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard overview stats
  - name: pois
    description: Points of Interest
  - name: pipeline
    description: Data pipeline metrics
  - name: cities
    description: City data
  - name: analytics
    description: Advanced analytics
  - name: recommendations
    description: POI recommendations
  - name: reports
    description: Periodic reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get overview statistics
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"

  /dashboard/poi-by-city:
    get:
      operationId: getPoiByCity
      tags: [dashboard]
      summary: POI counts grouped by city
      responses:
        "200":
          description: POI by city
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityPoiCount"

  /dashboard/poi-by-category:
    get:
      operationId: getPoiByCategory
      tags: [dashboard]
      summary: POI counts grouped by category
      responses:
        "200":
          description: POI by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryPoiCount"

  /dashboard/pipeline-funnel:
    get:
      operationId: getPipelineFunnel
      tags: [dashboard]
      summary: Bronze → Silver → Gold pipeline funnel
      responses:
        "200":
          description: Pipeline funnel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineFunnel"

  /dashboard/quality-distribution:
    get:
      operationId: getQualityDistribution
      tags: [dashboard]
      summary: Quality score distribution
      responses:
        "200":
          description: Quality distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityBucket"

  /dashboard/rating-distribution:
    get:
      operationId: getRatingDistribution
      tags: [dashboard]
      summary: Rating distribution
      responses:
        "200":
          description: Rating distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RatingBucket"

  /dashboard/quarantine-reasons:
    get:
      operationId: getQuarantineReasons
      tags: [dashboard]
      summary: Data quality quarantine reasons breakdown
      responses:
        "200":
          description: Quarantine reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuarantineReason"

  /pipeline/executions:
    get:
      operationId: getPipelineExecutions
      tags: [pipeline]
      summary: Recent pipeline executions
      responses:
        "200":
          description: Pipeline executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineExecution"

  /pipeline/sync-state:
    get:
      operationId: getPipelineSyncState
      tags: [pipeline]
      summary: Pipeline sync state summary
      responses:
        "200":
          description: Sync state summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncStateSummary"

  /cities:
    get:
      operationId: getCities
      tags: [cities]
      summary: Get all cities
      responses:
        "200":
          description: Cities list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"

  /pois:
    get:
      operationId: getPois
      tags: [pois]
      summary: Browse gold-layer POIs
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: POIs list with total count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoisResponse"

  /pois/top-rated:
    get:
      operationId: getTopRatedPois
      tags: [pois]
      summary: Top rated POIs
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Top rated POIs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Poi"

  /analytics/temporal:
    get:
      operationId: getAnalyticsTemporal
      tags: [analytics]
      summary: Time-series of POI collection by layer
      responses:
        "200":
          description: Temporal series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemporalPoint"

  /analytics/sources:
    get:
      operationId: getAnalyticsSources
      tags: [analytics]
      summary: Data source breakdown (OSM / Google / Both)
      responses:
        "200":
          description: Source breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceBreakdown"

  /analytics/quality-tiers:
    get:
      operationId: getAnalyticsQualityTiers
      tags: [analytics]
      summary: Quality tier distribution
      responses:
        "200":
          description: Quality tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityTier"

  /analytics/city-category-matrix:
    get:
      operationId: getAnalyticsCityCategoryMatrix
      tags: [analytics]
      summary: POI count matrix by city × category
      responses:
        "200":
          description: City-category matrix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityCategory"

  /recommendations:
    get:
      operationId: getRecommendations
      tags: [recommendations]
      summary: Get POI recommendations
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: mode
          in: query
          schema:
            type: string
            enum: [top_rated, hidden_gems, highly_reviewed, best_quality, multi_source, random]
            default: top_rated
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"

  /recommendations/city-highlights:
    get:
      operationId: getCityHighlights
      tags: [recommendations]
      summary: Top highlight per city
      responses:
        "200":
          description: City highlights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CityHighlight"

  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Periodic data report
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [weekly, monthly, yearly]
            default: monthly
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    DashboardOverview:
      type: object
      required: [bronzePois, silverPois, goldPois, cities, quarantined, pipelineRuns, dataLineageEdges, avgQualityScore, avgRating]
      properties:
        bronzePois: { type: integer }
        silverPois: { type: integer }
        goldPois: { type: integer }
        cities: { type: integer }
        quarantined: { type: integer }
        pipelineRuns: { type: integer }
        dataLineageEdges: { type: integer }
        avgQualityScore: { type: number }
        avgRating: { type: number }

    CityPoiCount:
      type: object
      required: [city, cityName, count]
      properties:
        city: { type: string }
        cityName: { type: string }
        count: { type: integer }

    CategoryPoiCount:
      type: object
      required: [category, count]
      properties:
        category: { type: string }
        count: { type: integer }

    PipelineFunnel:
      type: object
      required: [bronze, silver, gold, quarantine]
      properties:
        bronze: { type: integer }
        silver: { type: integer }
        gold: { type: integer }
        quarantine: { type: integer }

    QualityBucket:
      type: object
      required: [range, count]
      properties:
        range: { type: string }
        count: { type: integer }

    RatingBucket:
      type: object
      required: [range, count]
      properties:
        range: { type: string }
        count: { type: integer }

    QuarantineReason:
      type: object
      required: [rule, count]
      properties:
        rule: { type: string }
        count: { type: integer }

    PipelineExecution:
      type: object
      required: [executionId, pipelineName, status, startedAt, cities, categories, recordsProcessed, recordsFailed]
      properties:
        executionId: { type: string }
        pipelineName: { type: string }
        status: { type: string }
        startedAt: { type: string }
        completedAt: { type: ["string", "null"] }
        cities:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        recordsProcessed: { type: integer }
        recordsFailed: { type: integer }
        currentStage: { type: string }

    SyncStateSummary:
      type: object
      required: [city, category, currentCount, status, upsertedCount]
      properties:
        city: { type: string }
        category: { type: string }
        currentCount: { type: integer }
        status: { type: string }
        upsertedCount: { type: integer }

    City:
      type: object
      required: [cityCode, name, nameEn, region, population]
      properties:
        cityCode: { type: string }
        name: { type: string }
        nameEn: { type: string }
        region: { type: string }
        population: { type: integer }
        description: { type: ["string", "null"] }

    Poi:
      type: object
      required: [poiId, name, city, cityName, category, rating, reviewCount, qualityScore]
      properties:
        poiId: { type: string }
        name: { type: string }
        city: { type: string }
        cityName: { type: string }
        category: { type: string }
        subcategory: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        rating: { type: ["number", "null"] }
        reviewCount: { type: ["integer", "null"] }
        qualityScore: { type: ["number", "null"] }
        imageUrl: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        priceLevel: { type: ["integer", "null"] }

    PoisResponse:
      type: object
      required: [pois, total]
      properties:
        pois:
          type: array
          items:
            $ref: "#/components/schemas/Poi"
        total: { type: integer }

    TemporalPoint:
      type: object
      required: [date, bronze, silver, gold]
      properties:
        date: { type: string }
        bronze: { type: integer }
        silver: { type: integer }
        gold: { type: integer }

    SourceBreakdown:
      type: object
      required: [osmOnly, googleOnly, both, total]
      properties:
        osmOnly: { type: integer }
        googleOnly: { type: integer }
        both: { type: integer }
        total: { type: integer }

    QualityTier:
      type: object
      required: [tier, count]
      properties:
        tier: { type: string }
        count: { type: integer }

    CityCategory:
      type: object
      required: [city, cityName, category, count]
      properties:
        city: { type: string }
        cityName: { type: string }
        category: { type: string }
        count: { type: integer }

    RecommendedPoi:
      type: object
      required: [poiId, name, city, cityName, category]
      properties:
        poiId: { type: string }
        name: { type: string }
        city: { type: string }
        cityName: { type: string }
        category: { type: string }
        rating: { type: ["number", "null"] }
        reviewCount: { type: ["integer", "null"] }
        qualityScore: { type: ["number", "null"] }
        address: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        dataSources:
          type: array
          items: { type: string }

    RecommendationsResponse:
      type: object
      required: [mode, count, pois]
      properties:
        mode: { type: string }
        city: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        count: { type: integer }
        pois:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedPoi"

    CityHighlight:
      type: object
      required: [city, cityName, avgRating, totalPois]
      properties:
        city: { type: string }
        cityName: { type: string }
        avgRating: { type: number }
        totalPois: { type: integer }
        topPoi:
          type: object
          properties:
            name: { type: string }
            rating: { type: number }
            category: { type: string }
            reviewCount: { type: integer }

    ReportTotals:
      type: object
      required: [bronze, silver, gold, quarantine, cities]
      properties:
        bronze: { type: integer }
        silver: { type: integer }
        gold: { type: integer }
        quarantine: { type: integer }
        cities: { type: integer }

    ReportPeriodStats:
      type: object
      required: [newBronze, newSilver, newGold]
      properties:
        newBronze: { type: integer }
        newSilver: { type: integer }
        newGold: { type: integer }

    ReportQuality:
      type: object
      required: [avgQualityScore, avgRating, multiSourcePois, tiers]
      properties:
        avgQualityScore: { type: number }
        avgRating: { type: number }
        multiSourcePois: { type: integer }
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/QualityTier"

    ReportSummary:
      type: object
      required: [period, since, generatedAt, totals, periodStats, quality, topCities, topCategories, recentExecutions]
      properties:
        period: { type: string }
        since: { type: string }
        generatedAt: { type: string }
        totals:
          $ref: "#/components/schemas/ReportTotals"
        periodStats:
          $ref: "#/components/schemas/ReportPeriodStats"
        quality:
          $ref: "#/components/schemas/ReportQuality"
        topCities:
          type: array
          items:
            $ref: "#/components/schemas/CityPoiCount"
        topCategories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryPoiCount"
        recentExecutions:
          type: array
          items:
            type: object
