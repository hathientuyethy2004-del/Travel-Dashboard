kind = "data-app"
previewPath = "/"
title = "Smart Travel Platform Dashboard"
version = "1.0.0"
id = "artifacts/travel-dashboard"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20411

[services.development]
run = "pnpm --filter @workspace/travel-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/travel-dashboard", "run", "build" ]
publicDir = "artifacts/travel-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20411"
BASE_PATH = "/"
